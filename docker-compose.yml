name: outbound

services:
  db:
    image: postgres:16-alpine
    container_name: outbound-db
    environment:
      POSTGRES_USER: outbound
      POSTGRES_PASSWORD: outbound
      POSTGRES_DB: outbound
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbound -d outbound"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: outbound-api
    ports:
      - "8004:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=debug
      - DATABASE_URL=postgresql://outbound:outbound@db:5432/outbound
    volumes:
      - ./backend:/app:delegated
      - /app/node_modules
      - /app/dist
    depends_on:
      db:
        condition: service_healthy
    # Use Node.js for health check (wget not available in Alpine)
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: outbound-frontend
    ports:
      - "3006:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8004
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
    depends_on:
      - api
    # Use Node.js for health check
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:

networks:
  default:
    name: outbound-network
