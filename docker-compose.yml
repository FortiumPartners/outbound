name: outbound

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: outbound-api
    ports:
      - "8004:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=debug
      - DATABASE_URL=postgresql://fortium_render_production_postgres_user:qUoIQ7rLsDBEDEu7kZwfKHyuIXIXyCXC@dpg-d5dcfmqli9vc73dfrfvg-a.oregon-postgres.render.com/outbound
      - HUBSPOT_ACCESS_TOKEN=${HUBSPOT_ACCESS_TOKEN}
      - HUBSPOT_PORTAL_ID=${HUBSPOT_PORTAL_ID:-48750181}
    volumes:
      - ./backend:/app:delegated
      - /app/node_modules
      - /app/dist
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Use Node.js for health check (wget not available in Alpine)
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: outbound-frontend
    ports:
      - "3006:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8004
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
    depends_on:
      - api
    # Use Node.js for health check
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  default:
    name: outbound-network
