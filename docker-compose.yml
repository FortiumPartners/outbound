name: outbound

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: outbound-api
    ports:
      - "8004:8000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=debug
      - DATABASE_URL=postgresql://fortium_render_production_postgres_user:qUoIQ7rLsDBEDEu7kZwfKHyuIXIXyCXC@dpg-d5dcfmqli9vc73dfrfvg-a.oregon-postgres.render.com/outbound
      - HUBSPOT_ACCESS_TOKEN=${HUBSPOT_ACCESS_TOKEN}
      - HUBSPOT_PORTAL_ID=${HUBSPOT_PORTAL_ID:-48750181}
      # PartnerConnect API credentials
      - PC_CLIENT_ID=${PC_CLIENT_ID}
      - PC_CLIENT_SECRET=${PC_CLIENT_SECRET}
      # Auth configuration (Fortium Identity integration)
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      # OIDC_ISSUER must include /oidc path - Identity serves OIDC endpoints there
      - OIDC_ISSUER=http://host.docker.internal:3099/oidc
      - OIDC_CLIENT_ID=outbound-api
      - ENABLE_TEST_AUTH=true
      - TEST_AUTH_KEY=${TEST_AUTH_KEY}
      # OpenTelemetry (disabled in dev by default — set in .env to enable)
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-outbound-api}
    volumes:
      - ./backend:/app:delegated
      - /app/node_modules
      - /app/dist
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Use Node.js for health check (wget not available in Alpine)
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: outbound-frontend
    ports:
      - "3006:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8004
      # OIDC Configuration (Fortium Identity)
      - VITE_OIDC_ISSUER=http://localhost:3099/oidc
      - VITE_OIDC_CLIENT_ID=outbound-api
      - VITE_OIDC_REDIRECT_URI=http://localhost:3006/auth/callback
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
    depends_on:
      - api
    # Use Node.js for health check
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  default:
    name: outbound-network
