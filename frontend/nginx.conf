server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /auth and /api to backend — keeps cookies on same origin
    location /auth/ {
        proxy_pass https://outbound-ikby.onrender.com/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
    }

    location /api/ {
        proxy_pass https://outbound-ikby.onrender.com/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
    }

    # Agent auto-redirect: if identity_agent cookie is set, skip the login page
    # and go straight to the OIDC flow (Identity already has the agent's session)
    location = /login {
        if ($cookie_identity_agent = "1") {
            return 302 /auth/login;
        }
        try_files /index.html =404;
    }

    # SPA routing - always serve index.html for non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
