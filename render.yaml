# Render Blueprint - Fortium Outbound
# https://render.com/docs/blueprint-spec

services:
  # Backend API
  - type: web
    name: outbound-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    repo: https://github.com/FortiumPartners/outbound
    branch: main
    healthCheckPath: /health
    plan: starter  # $7/mo - can upgrade later
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false  # Set to Render Postgres internal URL
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
      # Auth configuration
      - key: JWT_SECRET
        generateValue: true  # Render generates a secure random value
      - key: COOKIE_SECRET
        generateValue: true  # Render generates a secure random value
      - key: IDENTITY_ISSUER
        value: https://identity.fortiumsoftware.com/oidc
      - key: SCOUT_API_KEY
        sync: false
      # OpenTelemetry (Grafana Cloud)
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: OTEL_SERVICE_NAME
        value: outbound-api

  # Frontend static site
  - type: web
    name: outbound-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    repo: https://github.com/FortiumPartners/outbound
    branch: main
    plan: starter
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # Set to https://outbound-api.onrender.com

  # Lead5 Scout - runs daily at 6am ET (11:00 UTC)
  - type: cron
    name: lead5-scout
    runtime: docker
    dockerfilePath: ./scouts/lead5-scout/Dockerfile
    dockerContext: ./scouts/lead5-scout
    repo: https://github.com/FortiumPartners/outbound
    branch: main
    schedule: "0 11 * * *"  # 6am ET = 11:00 UTC
    plan: starter
    envVars:
      - key: LEAD5_EMAIL
        sync: false
      - key: LEAD5_PASSWORD
        sync: false
      - key: OUTBOUND_API_URL
        value: https://outbound-ikby.onrender.com
      - key: DRY_RUN
        value: "false"
      - key: MAX_RESULTS
        value: "50"
      - key: RATE_LIMIT_MS
        value: "2000"
      - key: OUTBOUND_API_KEY
        sync: false

  # StateScoop Scout - monitors gov tech executive moves via RSS
  - type: cron
    name: statescoop-scout
    runtime: docker
    dockerfilePath: ./scouts/statescoop-scout/Dockerfile
    dockerContext: ./scouts/statescoop-scout
    repo: https://github.com/FortiumPartners/outbound
    branch: main
    schedule: "0 */6 * * *"  # Every 6 hours
    plan: starter
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OUTBOUND_API_URL
        value: https://outbound-ikby.onrender.com
      - key: DRY_RUN
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: LOOKBACK_DAYS
        value: "7"
      - key: OUTBOUND_API_KEY
        sync: false
